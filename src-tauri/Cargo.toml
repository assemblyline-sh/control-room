[package]
name = "control-room"
version = "0.1.0"
description = "Desktop window onto Assembly Line factory floors."
authors = ["Assembly Line"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "control_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
serde_norway = "0.9"
base64 = "0.22"
portable-pty = "0.9.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
